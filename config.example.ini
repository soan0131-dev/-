; 입퇴사자 알림 설정 예시
; 이 파일을 config.ini 로 복사한 뒤 환경에 맞게 수정하세요. (UTF-8 로 저장)
; 경로 값의 상대 경로는 이 설정 파일이 있는 폴더 기준이며, 환경 변수(%VAR% 또는 $VAR)를 쓸 수 있습니다.
;
; SMTP 계정/비밀번호는 이 파일에 적지 말고 환경 변수로 지정합니다.
;   HR_NOTIFIER_SMTP_USER, HR_NOTIFIER_SMTP_PASSWORD

[input]
; 입퇴사자 명단 파일 (.csv / .xlsx)
path = samples/sample_roster.csv
; CSV 인코딩. 비워두면 utf-8-sig → cp949 순으로 자동 판별
encoding =
; xlsx 시트 이름. 비워두면 첫 번째 시트
sheet =

[columns]
; 명단 파일의 헤더 이름 매핑 (position, email 은 선택)
employee_id = 사번
name = 성명
department = 부서
position = 직급
event_type = 구분
date = 일자
email = 이메일

[event_values]
; '구분' 컬럼 값 (쉼표로 여러 개 지정 가능)
join = 입사, 신규입사
leave = 퇴사

[schedule]
; 입사/퇴사일 며칠 전부터 알림 대상에 포함할지
lead_days = 7
; 이미 지난 입사/퇴사일을 며칠까지 소급 발송할지 (등록이 늦은 경우 대비)
past_days = 3

[smtp]
host = smtp.example.com
port = 587
; starttls | ssl | none
security = starttls
sender = hr-noti@example.com
timeout = 30

; ---------------------------------------------------------------------------
; 알림 채널
;   [announce]       : 전사 공지 메일
;   [team:부서이름]  : 담당 부서별 업무 처리 요청 메일 (원하는 만큼 추가)
;   kinds            : join, leave 중 해당 채널이 받을 이벤트 (기본: 둘 다)
;   join_tasks / leave_tasks : 메일에 포함할 처리 항목 (한 줄에 하나, 들여쓰기로 이어 씀)
; ---------------------------------------------------------------------------

[announce]
to = all@example.com
cc =
kinds = join, leave

[team:IT]
to = it@example.com
join_tasks =
    AD/메일 계정 생성
    PC 및 장비 지급
    그룹웨어·업무 시스템 권한 부여
leave_tasks =
    계정 비활성화 (퇴사일 업무 종료 시점)
    PC 및 장비 회수, 데이터 백업
    시스템 권한 회수

[team:총무]
to = ga@example.com
join_tasks =
    출입카드 발급
    좌석 배정 및 명함 제작
leave_tasks =
    출입카드 회수
    법인카드·비품 반납 확인

[team:보안]
to = security@example.com
kinds = leave
leave_tasks =
    보안 서약서 징구
    외부 반출 이력 점검

[state]
; 발송 이력 파일 (중복 발송 방지)
path = state/sent.json

[log]
; 로그 파일 (비워두면 콘솔만 출력)
path = logs/hr_notifier.log
